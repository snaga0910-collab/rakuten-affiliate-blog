<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" role="img" aria-label="1回あたりのコスト比較">
<style>
  .ttl{font:600 15px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;fill:#1c1f23}
  .sub{font:400 12px "Hiragino Sans",system-ui,sans-serif;fill:#6d6a65}
  .lbl{font:400 13px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;fill:#3b3f45}
  .val{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#3b3f45;font-variant-numeric:tabular-nums}
  .valhi{fill:#2f6fae}
  .track{fill:#eeece8}
  .bar{fill:#2f6fae;opacity:.42}
  .bar.hi{opacity:1}
  .rng{fill:#2f6fae;opacity:.18}
  @media (prefers-color-scheme:dark){
    .ttl{fill:#e8e6e1}.sub{fill:#9a968f}.lbl{fill:#c9c6c1}.val{fill:#c9c6c1}
    .track{fill:#2b2e33}
  }
</style>
<text x="0" y="20" class="ttl">1回あたりのコスト比較</text>
<text x="0" y="38" class="sub">数値は内容量と一般的な使用量からの概算（記事本文の比較表と同じ値）</text>

  <text x="0" y="71" class="lbl">アタック抗菌EX 部屋…</text>
  <rect x="178" y="58" width="476" height="22" rx="4" class="track"/>
  
  <rect x="178" y="58" width="247.52" height="22" rx="4" class="bar hi"/>
  <text x="435.52" y="74" class="val valhi">13円</text>
  <text x="0" y="111" class="lbl">ナノックス ニオイ専用…</text>
  <rect x="178" y="98" width="476" height="22" rx="4" class="track"/>
  
  <rect x="178" y="98" width="323.68" height="22" rx="4" class="bar"/>
  <text x="511.68" y="114" class="val">17円</text>
  <text x="0" y="151" class="lbl">アタックZERO 6個…</text>
  <rect x="178" y="138" width="476" height="22" rx="4" class="track"/>
  <rect x="577.8399999999999" y="138" width="19.04000000000002" height="22" rx="4" class="rng"/>
  <rect x="178" y="138" width="399.84" height="22" rx="4" class="bar"/>
  <text x="606.88" y="154" class="val">21〜22円</text>
  <text x="0" y="191" class="lbl">さらさ 超ジャンボ 6個</text>
  <rect x="178" y="178" width="476" height="22" rx="4" class="track"/>
  <rect x="577.8399999999999" y="178" width="76.16000000000003" height="22" rx="4" class="rng"/>
  <rect x="178" y="178" width="399.84" height="22" rx="4" class="bar"/>
  <text x="664" y="194" class="val">21〜25円</text>
</svg>